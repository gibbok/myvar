<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#cb2a42" />
    <title>404 - Page Not Found | MyVar.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --color-bg: hsl(210, 33%, 99%);
        --color-bg-soft: hsl(215, 43%, 97%);
        --color-surface: hsl(0, 0%, 100%);
        --color-text: hsl(222, 47%, 11%);
        --color-text-soft: hsl(222, 20%, 34%);
        --color-muted: hsl(220, 9%, 46%);
        --color-border-soft: hsl(220, 24%, 93%);
        --color-accent: hsl(351, 66%, 48%);
        --color-accent-strong: hsl(351, 72%, 38%);
        --shadow-card: 0 1rem 3rem hsla(222, 47%, 11%, 0.07);
        --font-sans: "Roboto", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--color-bg);
        font-size: 100%;
        text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, hsla(220, 100%, 98%, 0.92), transparent 24rem),
          radial-gradient(circle at 18% 0, hsla(351, 100%, 96%, 0.88), transparent 18rem),
          var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-optical-sizing: auto;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        font-weight: 400;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
      }

      .page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .header,
      .footer,
      .main {
        width: min(100% - 2rem, 72rem);
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        padding: 1.15rem 0;
        border-bottom: 0.0625rem solid hsla(220, 18%, 88%, 0.86);
      }

      .brand {
        display: flex;
        flex-direction: column;
        text-decoration: none;
      }

      .brand__title {
        color: var(--color-text);
        font-size: clamp(1.35rem, 2vw, 1.75rem);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1;
      }

      .brand__accent {
        color: var(--color-accent);
      }

      .brand__subtitle {
        margin-top: 0.35rem;
        color: var(--color-muted);
        font-size: 0.82rem;
        font-weight: 500;
        line-height: 1.3;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.35rem;
      }

      .nav a {
        display: inline-flex;
        align-items: center;
        min-height: 2.25rem;
        padding: 0.45rem 0.7rem;
        border-radius: 0.5rem;
        color: var(--color-text-soft);
        font-size: 0.92rem;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
      }

      .nav a:hover {
        background: var(--color-surface);
        color: var(--color-text);
        box-shadow: inset 0 0 0 0.0625rem var(--color-border-soft);
      }

      .main {
        display: grid;
        flex: 1;
        place-items: center;
        padding: 4rem 0 5rem;
      }

      .error-panel {
        width: min(100%, 52rem);
        padding: clamp(1.25rem, 4vw, 2.5rem);
        border: 0.0625rem solid var(--color-border-soft);
        border-radius: 0.75rem;
        background: hsla(0, 0%, 100%, 0.86);
        box-shadow: var(--shadow-card);
      }

      .eyebrow {
        margin: 0 0 0.85rem;
        color: var(--color-accent);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      h1 {
        max-width: 46rem;
        margin: 0;
        color: var(--color-text);
        font-size: clamp(2.6rem, 8vw, 5.6rem);
        font-weight: 850;
        letter-spacing: 0;
        line-height: 0.98;
      }

      .description {
        max-width: 40rem;
        margin: 1.25rem 0 0;
        color: var(--color-text-soft);
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.7rem 1rem;
        border: 0.0625rem solid var(--color-border-soft);
        border-radius: 0.5rem;
        background: var(--color-surface);
        color: var(--color-text);
        font-weight: 800;
        line-height: 1.2;
        text-decoration: none;
      }

      .button:hover {
        border-color: hsl(220, 18%, 80%);
        box-shadow: 0 0.5rem 1.5rem hsla(222, 47%, 11%, 0.07);
      }

      .button--primary {
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: white;
      }

      .button--primary:hover {
        border-color: var(--color-accent-strong);
        background: var(--color-accent-strong);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.5rem 0 2rem;
        border-top: 0.0625rem solid var(--color-border-soft);
        color: var(--color-muted);
        font-size: 0.9rem;
      }

      .footer p {
        margin: 0;
      }

      .footer__nav {
        display: flex;
        gap: 0.9rem;
      }

      .footer__nav a {
        color: var(--color-text-soft);
        font-weight: 700;
        text-decoration: none;
      }

      .footer__nav a:hover {
        color: var(--color-accent);
      }

      @media (max-width: 54rem) {
        .header {
          align-items: flex-start;
          flex-direction: column;
          gap: 1rem;
        }

        .nav {
          justify-content: flex-start;
        }

        .main {
          place-items: start;
          padding: 2.6rem 0 4rem;
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 34rem) {
        .header,
        .footer,
        .main {
          width: min(100% - 1.25rem, 72rem);
        }

        h1 {
          line-height: 1.04;
        }

        .actions {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <a class="brand" href="/myvar/">
          <span class="brand__title">MyVar<span class="brand__accent">.dev</span></span>
          <span class="brand__subtitle">Technologies and Software Engineering</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="/myvar/">Home</a>
          <a href="/myvar/tags/">Tags</a>
          <a href="/myvar/sitemap.html">Sitemap</a>
        </nav>
      </header>

      <main class="main">
        <section class="error-panel" aria-labelledby="error-title">
          <p class="eyebrow">404</p>
          <h1 id="error-title">Page not found.</h1>
          <p class="description">
            The article or resource you requested is not available at this address. Use the directory links to get back to the technical notes.
          </p>
          <div class="actions">
            <a class="button button--primary" href="/myvar/">Return home</a>
            <a class="button" href="/myvar/sitemap.html">View sitemap</a>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>Copyright 2026. All rights reserved.</p>
        <nav class="footer__nav" aria-label="Footer">
          <a href="/myvar/sitemap.html">Sitemap</a>
          <a href="/myvar/index.xml">RSS</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
